# Which faces to cut, and from which upstream masters.
#
# The cut .woff2 files are committed, so an ordinary build never touches the
# network. This manifest only matters when adding a face or refreshing upstream:
#   bf assets --fonts
#
# The variable masters (_var_*.ttf, ~1.8 MB) are git-ignored -- they are inputs,
# refetched on demand.

variable:
  - family_dir: archivo
    file: "Archivo[wdth,wght].ttf"
    instances:
      - {pin: {wdth: 100, wght: 400}, name: Archivo-Regular}
      - {pin: {wdth: 100, wght: 600}, name: Archivo-SemiBold}
      - {pin: {wdth: 100, wght: 700}, name: Archivo-Bold}
  - family_dir: sourceserif4
    file: "SourceSerif4[opsz,wght].ttf"
    instances:
      - {pin: {opsz: 11, wght: 400}, name: SourceSerif4-Regular}
      - {pin: {opsz: 11, wght: 600}, name: SourceSerif4-SemiBold}

  # Fraunces is variable, and Chrome prints variable fonts as Type 3 -- in the
  # essay books that meant the headings rendered as an unnamed, unextractable
  # face. These statics replace the Google Fonts variable delivery.
  - family_dir: fraunces
    file: "Fraunces[SOFT,WONK,opsz,wght].ttf"
    instances:
      - {pin: {SOFT: 0, WONK: 0, opsz: 144, wght: 400}, name: Fraunces-Regular}
      - {pin: {SOFT: 0, WONK: 0, opsz: 144, wght: 600}, name: Fraunces-SemiBold}
      - {pin: {SOFT: 0, WONK: 0, opsz: 144, wght: 800}, name: Fraunces-ExtraBold}
  - family_dir: fraunces
    file: "Fraunces-Italic[SOFT,WONK,opsz,wght].ttf"
    instances:
      - {pin: {SOFT: 0, WONK: 0, opsz: 144, wght: 400}, name: Fraunces-Italic}
      - {pin: {SOFT: 0, WONK: 0, opsz: 144, wght: 600}, name: Fraunces-SemiBoldItalic}

# Already static upstream; converted to woff2 for size only.
static:
  - IBMPlexMono-Regular
  - IBMPlexMono-Medium
  - IBMPlexMono-SemiBold
